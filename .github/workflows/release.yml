name: Release

# 打 tag（v*）自动构建并发布 Release，附 DMG 与 zip。
# CI 无本机证书，产物为 ad-hoc 签名（-unsigned 后缀）：接收方首次打开需
# 右键→打开，且每个新版本需重新授权辅助功能/输入监控（README 已说明）。

on:
  push:
    tags: ["v*"]
  # fork 上推 tag 不一定触发 push 事件，可手动指定已存在的 tag 发布
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的已存在 tag，如 v0.3.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0   # git describe 需要完整历史与 tag
      - name: 构建 + 自检
        run: |
          ./build.sh
          .build/miremote --self-test
      - name: 组装 .app（ad-hoc）
        run: scripts/package.sh --unsigned
      - name: 打 DMG
        run: scripts/make-dmg.sh --unsigned
      - name: 发布 Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --title "MiRemote ${TAG}" \
            --generate-notes \
            dist/*.dmg dist/*.zip
