name: CI

on:
  push:
    branches: [master, main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    # GitHub 的 macOS 27 镜像标签为 xcode-27（默认 Xcode 27.1 正式版 / macOS 27 SDK）
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: 工具链信息
        run: swiftc --version && xcodebuild -version && sw_vers
      - name: 构建
        run: ./build.sh
      - name: 自检
        # FAIL 行转成 ::error 注解：Actions 日志需登录才能看，注解走公开 API 可匿名读，
        # 便于在无 gh 登录的环境远程诊断 CI 失败。
        run: |
          set +e
          .build/miremote --self-test 2>&1 | tee selftest.log
          code=${PIPESTATUS[0]}
          grep '^FAIL' selftest.log | head -10 | while IFS= read -r line; do
            echo "::error::${line}"
          done
          if [ "${code}" != "0" ] && ! grep -q '^FAIL' selftest.log; then
            echo "::error::self-test 异常退出 code=${code}，无 FAIL 行（可能是崩溃/信号），尾部输出："
            tail -5 selftest.log | while IFS= read -r line; do echo "::error::tail: ${line}"; done
          fi
          exit "${code}"
        shell: bash
      - name: 界面快照（隐藏 --snapshot，开发核对用）
        # 真实 NSWindow 渲染各窗口状态并截图；不影响构建结论
        continue-on-error: true
        timeout-minutes: 6
        run: |
          # runner 默认开启「降低透明度」，系统级材质会画成不透明；尝试关闭（失败不影响）
          defaults write com.apple.universalaccess reduceTransparency -bool false || true
          defaults read com.apple.universalaccess reduceTransparency || true
          # runner 虚拟屏默认 1024x768，放不下原型的 1120x700 标准窗；尽力调大（各虚拟化方案择一，失败不影响）
          if [ -x "/Library/Application Support/VMware Tools/vmware-resolutionSet" ]; then
            sudo "/Library/Application Support/VMware Tools/vmware-resolutionSet" 1600 1000 || true
          elif [ -x "/Library/Application Support/Veertu/Anka/addons/change_res" ]; then
            "/Library/Application Support/Veertu/Anka/addons/change_res" 1600x1000x32@30 || true
          fi
          sleep 3
          system_profiler SPDisplaysDataType 2>/dev/null | grep -i -E "resolution|virtual|display type" || true
          ls "/Library/Application Support/" | grep -i -E "vmware|veertu|anka|parallels|tart" || true
          .build/miremote --snapshot snapshots 2>&1 | tail -80
        shell: bash
      - name: 上传界面快照
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-snapshots
          path: snapshots/
          if-no-files-found: warn
