<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiRemote UI 重设计 · 原型 v2（全部窗体）</title>
<style>
:root{--bg:#ececee;--win:#ffffff;--side:#f3f3f5;--card:#ffffff;--line:#e3e3e8;--line2:#d2d2d8;--text:#1d1d1f;--text2:#6e6e73;--text3:#a1a1a6;--accent:#0a66ff;--accent-soft:rgba(10,102,255,.10);--ok:#1fa64a;--warn:#e08a00;--warn-soft:rgba(224,138,0,.12);--err:#e0352b;--err-soft:rgba(224,53,43,.10);--mat:rgba(246,246,248,.88);--desk1:#c9ced8;--desk2:#aeb6c4;--shadow:0 20px 60px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.12);--keycap:#1d1d1f}
html[data-theme=dark]{--bg:#1b1b1d;--win:#1f1f22;--side:#28282b;--card:#2c2c30;--line:#38383d;--line2:#48484e;--text:#f2f2f4;--text2:#a1a1a8;--text3:#6c6c72;--accent:#3d8bff;--accent-soft:rgba(61,139,255,.16);--ok:#32c25c;--warn:#ffb340;--warn-soft:rgba(255,179,64,.14);--err:#ff5a4f;--err-soft:rgba(255,90,79,.14);--mat:rgba(40,40,44,.88);--desk1:#2b3140;--desk2:#171b24;--shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 .5px rgba(255,255,255,.12);--keycap:#f2f2f4}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Helvetica Neue",sans-serif}
button{font:inherit}
.proto{position:sticky;top:0;z-index:99;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 14px;background:#111;color:#ddd;font-size:12px}
.proto b{color:#fff;margin-right:6px}.proto label{display:flex;gap:4px;align-items:center}
.proto select{background:#222;color:#eee;border:1px solid #444;border-radius:5px;padding:2px 4px;font-size:12px}
.proto .note{color:#888;margin-left:auto}
html.shot .proto{display:none}
.stage{padding:22px;display:flex;justify-content:center}
html.shot .stage{padding:20px}
.win{position:relative;width:1120px;height:700px;background:var(--win);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.win.narrow{width:780px;height:580px}
.titlebar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.tl{width:12px;height:12px;border-radius:50%}.tl.r{background:#ff5f57}.tl.y{background:#febc2e}.tl.g{background:#28c840}
.titlebar .t{margin-left:12px;font-weight:600;color:var(--text2)}
.wbody{flex:1;display:flex;min-height:0}
.side{width:216px;background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex:none}
.win.narrow .side{width:176px}
.dev{display:flex;gap:10px;align-items:center;padding:4px 6px 12px}
.devic{width:34px;height:34px;border-radius:9px;background:#1d1d1f;display:grid;place-items:center;flex:none}
.devic i{width:9px;height:20px;border:2px solid #fff;border-radius:4px;display:block}
.dev .k{font-size:10px;color:var(--text3);letter-spacing:.3px}
.dev .n{font-weight:600}
.dev .s{font-size:11px;color:var(--text2);display:flex;gap:4px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--ok);flex:none}
.dot.off{background:var(--text3)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.issue{margin:0 4px 8px;padding:7px 9px;border-radius:8px;background:var(--warn-soft);font-size:11.5px;display:flex;gap:6px;align-items:center;cursor:pointer}
.issue.err{background:var(--err-soft)}
.issue .go{margin-left:auto;color:var(--accent);font-weight:600}
.nav{display:flex;gap:9px;align-items:center;padding:7px 10px;border-radius:7px;cursor:pointer}
.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .ic{width:18px;text-align:center}
.main{flex:1;min-width:0;overflow:auto;padding:20px 24px}
.win.narrow .main{padding:16px}
h1{font-size:20px;margin:0}
.ph{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.ph .sub{color:var(--text2);font-size:12px;margin-top:3px}
.grow{flex:1}
.btn{border:1px solid var(--line2);background:var(--card);color:var(--text);border-radius:7px;padding:5px 11px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--err)}
.btn.dangerfill{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--accent)}
.saved{color:var(--ok);font-size:12px;align-self:center}
.banner{display:flex;gap:10px;align-items:center;padding:9px 12px;border-radius:9px;margin-bottom:12px;font-size:12.5px}
.banner.warn{background:var(--warn-soft)}.banner.err{background:var(--err-soft)}.banner.info{background:var(--accent-soft)}
.group{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.gt{font-size:11.5px;color:var(--text2);margin:14px 4px 6px;display:flex;gap:6px;align-items:center}
.row{display:flex;gap:10px;align-items:center;padding:9px 12px;min-height:40px;border-top:1px solid var(--line)}
.row:first-child{border-top:none}
.row .ttl{flex:1;min-width:0}
.row .ttl small{display:block;color:var(--text2);font-size:11px}
.toggle{width:34px;height:20px;border-radius:10px;background:var(--line2);position:relative;flex:none}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.toggle.on{background:var(--ok)}.toggle.on::after{left:16px}
.seg{display:inline-flex;background:var(--line);border-radius:7px;padding:2px;gap:2px}
.seg span{padding:3px 10px;border-radius:5px;cursor:pointer;color:var(--text2);white-space:nowrap;font-size:12px}
.seg span.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--text2);white-space:nowrap}
.tag.ovr{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.tag.lock{background:var(--line)}
.tag.ok,.tag.live{border-color:transparent;background:rgba(31,166,74,.14);color:var(--ok)}
.tag.warn{border-color:transparent;background:var(--warn-soft);color:var(--warn)}
.tag.edit{border-color:transparent;background:var(--accent);color:#fff}
.muted{color:var(--text2)}.faint{color:var(--text3)}
.chev{color:var(--text3)}
.appic{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;color:#fff;font-size:12px;font-weight:700;flex:none}
.empty{padding:34px 20px;text-align:center;color:var(--text2)}
.empty .big{font-size:34px;margin-bottom:6px}
.scenechip{display:inline-flex;gap:7px;align-items:center;border:1px solid var(--line2);border-radius:8px;padding:4px 9px;background:var(--card);cursor:pointer;font-size:12.5px}
.scenechip .lk{color:var(--accent);font-size:11.5px}
.layerbar{display:flex;gap:8px;align-items:center;color:var(--accent);font-size:12px;margin-bottom:10px}
.mwrap{display:flex;gap:18px;min-height:0}
.rpanel{width:520px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 10px 8px;position:relative}
.win.narrow .rpanel{width:240px}
.rpanel .rtop{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--text2);margin-bottom:4px;flex-wrap:wrap}
.rstage{position:relative;width:500px;height:490px}
.rbody{position:absolute;left:0;top:0;width:500px;height:480px;transform-origin:0 0}
.lbl{position:absolute;width:150px;transform:translateY(-50%);padding:2px 6px;border-radius:6px;cursor:pointer}
.lbl.l{left:4px;text-align:right}.lbl.r{left:346px}
.lbl .kn{font-size:10px;color:var(--text3)}
.lbl .ac{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl.inh .ac{color:var(--text2)}.lbl.ovr .ac{color:var(--accent);font-weight:600}.lbl.lock .ac{color:var(--text2)}.lbl.none .ac{color:var(--text3);font-style:italic}
.lbl.sel{background:var(--accent-soft)}
.legend{display:flex;gap:12px;font-size:10.5px;color:var(--text2);padding:0 4px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.win.narrow .lbl,.win.narrow svg.lines,.win.narrow .legend .l2{display:none}
.win.narrow .rstage{width:220px;height:420px;overflow:hidden}
.win.narrow .rbody{transform:translate(-114px,0) scale(.86)}
.win.narrow .rpanel .rtop .seg span{padding:3px 5px}
.rsvgwrap{position:absolute;left:160px;top:0}
.rshell{fill:#d7d9db;stroke:#c1c3c6}
html[data-theme=dark] .rshell{fill:#525252;stroke:#404040}
.remote-key{cursor:pointer}.remote-key .hit{fill:transparent}
.remote-key .keyface{fill:#1c1c1e;stroke:transparent;stroke-width:2;transition:stroke .15s,filter .15s}
.remote-key.selected .keyface{stroke:var(--accent);filter:drop-shadow(0 0 3px rgba(10,102,255,.6))}
.remote-key .arc{fill:none;stroke:transparent;stroke-width:2.5;stroke-linecap:round;transition:stroke .15s}
.remote-key.selected .arc{stroke:var(--accent);filter:drop-shadow(0 0 3px rgba(10,102,255,.6))}
.remote-key .dot{fill:#6e6e73}.remote-key.selected .dot{fill:var(--accent)}
.remote-key.pulse .keyface{stroke:var(--accent);stroke-width:3;animation:pl 1.2s infinite}
@keyframes pl{50%{filter:drop-shadow(0 0 8px rgba(10,102,255,.9))}}
.insp{flex:1;min-width:0}
.khead{display:flex;gap:10px;align-items:center;margin-bottom:4px}
.kbadge{width:36px;height:36px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.khead .n{font-size:15px;font-weight:600}.khead .u{font-size:11px;color:var(--text2)}
.slot{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);min-height:40px}
.slot:first-child{border-top:none}
.slot .nm{width:64px;flex:none}.slot .nm small{display:block;font-size:10px;color:var(--text3)}
.slot .act{flex:1;display:flex;gap:6px;align-items:center;justify-content:flex-end;min-width:0}
.slot .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .v.dim{color:var(--text2)}.slot .v.none{color:var(--text3);font-style:italic}
.picker{border:1px solid var(--line2);border-radius:6px;padding:2px 8px;display:inline-flex;gap:6px;align-items:center;max-width:190px;background:var(--win)}
.picker.lockd{background:var(--line);border-color:transparent;color:var(--text2)}
.reset{color:var(--accent);font-size:11.5px;cursor:pointer;white-space:nowrap}
.lnote{font-size:11px;line-height:1.45;color:var(--text2);padding:0 12px 9px 12px}
.ico{display:inline-block;vertical-align:-.14em;flex:none}
.tag.live .ico{color:var(--ok);font-size:9px;vertical-align:0}
.disc{display:flex;gap:6px;align-items:center;margin:14px 4px 6px;cursor:pointer;font-size:13px}
.disc .tri{display:inline-block;transition:transform .15s;color:var(--text2);font-size:10px}
.disc.open .tri{transform:rotate(90deg)}
.foot{font-size:11px;color:var(--text3);margin-top:12px}
.search{display:flex;gap:6px;align-items:center;border:1px solid var(--line2);border-radius:7px;padding:4px 9px;background:var(--win);color:var(--text3);width:220px}
.prow{display:flex;gap:10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line);cursor:pointer}
.prow:first-child{border-top:none}
.prow:hover,.prow.hl{background:var(--accent-soft)}
.prow .ttl{flex:1;min-width:0}.prow .ttl small{display:block;color:var(--text2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.toolbar2{display:flex;gap:8px;align-items:center;margin:4px 0 8px;flex-wrap:wrap}
.sdim{position:absolute;inset:38px 0 0 0;background:rgba(0,0,0,.22);z-index:5}
.sheet{position:absolute;left:50%;top:38px;transform:translateX(-50%);background:var(--win);border-radius:0 0 12px 12px;box-shadow:0 18px 50px rgba(0,0,0,.3),0 0 0 .5px rgba(0,0,0,.2);z-index:6;display:flex;flex-direction:column;max-height:650px;max-width:calc(100% - 24px)}
.sheet .sh{padding:18px 20px 6px}.sheet .sh h2{margin:0;font-size:16px}.sheet .sh .sub{color:var(--text2);font-size:12px;margin-top:3px}
.sheet .sb{padding:8px 20px;overflow:auto;flex:1}
.sheet .sf{padding:12px 20px 16px;display:flex;gap:8px;justify-content:flex-end;border-top:1px solid var(--line);align-items:center}
.sheet .sf .left{margin-right:auto;font-size:11.5px;color:var(--text2)}
.alert{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:300px;background:var(--mat);backdrop-filter:blur(30px);border-radius:12px;box-shadow:var(--shadow);z-index:6;padding:20px;text-align:center}
.alert .ai{font-size:36px}.alert h3{margin:6px 0;font-size:14px}.alert p{font-size:12px;color:var(--text2);margin:0 0 14px}
.alert .ab{display:flex;flex-direction:column;gap:6px}.alert .ab .btn{padding:6px}
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;font-weight:500;color:var(--text2);font-size:11px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.k{white-space:nowrap}
.tbl .kc2{display:inline-grid;place-items:center;min-width:30px;height:22px;padding:0 5px;border-radius:5px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:11px;margin-right:6px}
.tbl .more{color:var(--text2);font-size:11px}
.tbl .x{color:var(--text3)}
.tbl .o{color:var(--accent);font-weight:600}
.steps{display:flex;gap:6px;align-items:center;justify-content:center;margin:4px 0 10px}
.steps .st{display:flex;gap:6px;align-items:center;color:var(--text3);font-size:12px}
.steps .st b{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);font-size:11px}
.steps .st.on{color:var(--text);font-weight:600}.steps .st.on b{background:var(--accent);border-color:var(--accent);color:#fff}
.steps .st.done b{background:var(--ok);border-color:var(--ok);color:#fff}
.steps .ln{width:40px;height:1.5px;background:var(--line2)}
.hc{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-top:1px solid var(--line)}
.hc:first-child{border-top:none}
.si{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:11px;font-weight:700;flex:none;margin-top:1px}
.si.ok{background:var(--ok)}.si.warn{background:var(--warn)}.si.err{background:var(--err)}.si.run{background:var(--text3)}
.hc .ttl{flex:1}.hc .ttl small{display:block;color:var(--text2);font-size:11.5px}
.kcap{display:inline-grid;place-items:center;min-width:40px;height:40px;padding:0 10px;border-radius:9px;background:var(--card);border:1px solid var(--line2);box-shadow:0 2px 0 var(--line2);font-size:18px;font-weight:600;margin:0 3px}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#a6d34a,var(--warn))}
.slider{position:relative;height:4px;border-radius:2px;background:var(--line2);flex:1}.slider i{position:absolute;left:0;top:0;height:100%;border-radius:2px;background:var(--accent)}.slider b{position:absolute;top:-6px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);margin-left:-8px}
.mcard{flex:1;border:1.5px solid var(--line2);border-radius:10px;padding:10px;cursor:pointer;background:var(--card)}
.mcard.on{border-color:var(--accent);background:var(--accent-soft)}
.mcard .h{font-weight:600}.mcard small{display:block;color:var(--text2);font-size:11px}
.desk{position:relative;width:1180px;height:740px;border-radius:10px;overflow:hidden;background:radial-gradient(1200px 600px at 20% 10%,var(--desk1),var(--desk2));box-shadow:var(--shadow)}
.desk.small{width:1000px;height:625px}
.mbar{height:26px;background:rgba(255,255,255,.55);backdrop-filter:blur(20px);display:flex;align-items:center;gap:16px;padding:0 14px;font-size:12.5px;color:#1d1d1f}
html[data-theme=dark] .mbar{background:rgba(30,30,32,.6);color:#f2f2f4}
.mbar .r{margin-left:auto;display:flex;gap:14px;align-items:center}
.sitem{display:flex;gap:4px;align-items:center;padding:1px 6px;border-radius:5px}
.sitem.on{background:rgba(0,0,0,.14)}html[data-theme=dark] .sitem.on{background:rgba(255,255,255,.18)}
.sitem .gl{width:8px;height:15px;border:1.6px solid currentColor;border-radius:3px;display:block}
.sitem.dim{opacity:.4}.sitem.red{color:var(--err)}.sitem.acc{color:var(--accent)}
.fakewin{position:absolute;background:rgba(255,255,255,.7);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.15)}
html[data-theme=dark] .fakewin{background:rgba(50,50,56,.7)}
.fakewin::before{content:"";position:absolute;left:12px;top:10px;width:50px;height:10px;background:radial-gradient(circle at 5px 5px,#ff5f57 5px,transparent 5.5px),radial-gradient(circle at 23px 5px,#febc2e 5px,transparent 5.5px),radial-gradient(circle at 41px 5px,#28c840 5px,transparent 5.5px)}
.ovl{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--mat);backdrop-filter:blur(40px) saturate(1.6);border-radius:18px;box-shadow:0 24px 70px rgba(0,0,0,.28),0 0 0 .5px rgba(0,0,0,.15);padding:16px 18px}
.ovh{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:12px}
.ovh .sub{font-weight:400;color:var(--text2);font-size:12px}
.hintbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:16px;align-items:center;background:var(--mat);backdrop-filter:blur(30px);border-radius:999px;padding:7px 16px;box-shadow:0 6px 20px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.12);font-size:12px;white-space:nowrap}
.hintbar span{display:flex;gap:4px;align-items:center}
.kc{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:5px;background:var(--keycap);color:var(--win);font-size:10.5px;font-weight:700;font-style:normal}
.wcard{width:150px;height:116px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;border:2px solid transparent;flex:none;position:relative}
.wcard.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.wcard .t{font-size:11.5px;line-height:1.3;max-height:30px;overflow:hidden}.wcard .a{font-size:10.5px;color:var(--text2)}
.wcard .num{position:absolute;left:7px;top:5px;font-size:10px;color:var(--text3)}
.big{width:38px;height:38px;border-radius:9px;font-size:18px}
.mgrid{display:grid;grid-template-columns:repeat(4,120px);gap:10px}
.mitem{height:76px;border-radius:12px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;border:2px solid transparent;position:relative}
.mitem .g{font-size:19px}
.mitem.sel{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mitem.red{color:var(--err)}.mitem.red small{font-size:10px;opacity:.8}
.mitem.sel.red{border-color:var(--err);box-shadow:0 0 0 4px var(--err-soft)}
.holdbar{position:absolute;left:8px;right:8px;bottom:5px;height:3px;border-radius:2px;background:var(--err-soft)}.holdbar i{display:block;height:100%;width:62%;background:var(--err);border-radius:2px}
.mcat{grid-column:1/-1;font-size:11px;color:var(--text2);margin:4px 2px -4px}
.wheel{position:relative;width:300px;height:300px}
.wheel .ci{position:absolute;inset:40px;border:1.5px dashed var(--line2);border-radius:50%}
.wheel .wi{position:absolute;width:56px;height:56px;margin:-28px;border-radius:50%;background:var(--card);display:grid;place-items:center;box-shadow:0 3px 10px rgba(0,0,0,.12)}

function render(){
 const h=document.documentElement; h.dataset.theme=S.theme;
 h.classList.toggle("glass-on",S.glass==="on"); h.classList.toggle("glass-rt",S.glass==="rt");
 let html;
 if(PAGES[S.screen]) html=winHtml(S.screen,PAGES[S.screen]());
 else if(S.screen==="dialog-delete") html=winHtml("profiles",profilesPage("chrome"),ctxDelete());
 else if(S.screen==="sheet-presets") html=winHtml("profiles",profilesPage(null,S.state==="layer"),sheetPresets());
 else if(SHEETS[S.screen]){const [pg,f]=SHEETS[S.screen]; html=winHtml(pg,PAGES[pg](),f());}
 else if(/^onb-/.test(S.screen)) html=winHtml("mapping",PAGES.mapping(),onboarding(+S.screen.slice(4)));
 else if(S.screen==="spec-battery") html=specBattery();
 else if(S.screen==="spec-remote") html=specRemote();
 else html=OVERLAYS[S.screen]();
 document.getElementById("stage").innerHTML=ICX(html); bind(); syncBar(); syncBat(); setUrl();
}
function setUrl(){const p=new URLSearchParams();Object.entries(S).forEach(([k,v])=>p.set(k,v));if(Q.get("shot"))p.set("shot",1);history.replaceState(null,"","?"+p)}
function bind(){
 document.querySelectorAll("#stage [data-key]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();S.key=e.dataset.key;render()});
 document.querySelectorAll("#stage [data-lbl]").forEach(e=>e.onclick=()=>{S.lbl=e.dataset.lbl;render()});
 document.querySelectorAll("#stage [data-go]").forEach(e=>e.onclick=ev=>{ev.stopPropagation();if(e.dataset.scene)S.scene=e.dataset.scene;S.screen=e.dataset.go;render()});
 const a=document.getElementById("advToggle"); if(a)a.onclick=()=>{S.adv=S.adv==="1"?"0":"1";render()};
 const sb=document.getElementById("sideBtn"); if(sb)sb.onclick=()=>{S.side=S.side==="hidden"?"open":"hidden";render()};
}
function syncBar(){[["pScreen","screen"],["pScene","scene"],["pState","state"],["pDevice","device"],["pLbl","lbl"],["pAdv","adv"],["pGest","gest"],["pSide","side"],["pGlass","glass"],["pTheme","theme"],["pWidth","width"]].forEach(([id,k])=>{const e=document.getElementById(id);if(!e)return;e.value=S[k];e.onchange=()=>{S[k]=e.value;render()}})}
function syncBat(){const r=document.getElementById("pBat"),n=document.getElementById("pBatNone"),v=document.getElementById("pBatV");if(!r)return;const p=batPct();n.checked=p==null;r.disabled=p==null;if(p!=null)r.value=p;v.textContent=p==null?"未知":p+"%";r.oninput=()=>{S.bat=r.value;render()};n.onchange=()=>{S.bat=n.checked?"none":r.value;render()}}
function init(){
 document.getElementById("pScreen").innerHTML=SCREENS.map(([g,l])=>`<optgroup label="${g}">${l.map(([v,n])=>`<option value="${v}">${n}</option>`).join("")}</optgroup>`).join("");
 document.getElementById("pScene").innerHTML=SCENES.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
 document.addEventListener("keydown",e=>{if(e.ctrlKey&&e.metaKey&&(e.key==="s"||e.key==="S")){e.preventDefault();S.side=S.side==="hidden"?"open":"hidden";render()}}); // ⌃⌘S 显示/隐藏边栏
 render();
}
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(render,80)});
init();
